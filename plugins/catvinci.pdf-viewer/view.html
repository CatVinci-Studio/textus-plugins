<!doctype html>
<html lang="{{lang}}">
  <head>
    <link rel="stylesheet" href="textus-resource:view.css" />
  </head>
  <body>
    <div class="toolbar">
      <button class="icon" id="prev">‹</button>
      <input id="page" type="number" min="1" value="1" />
      <span id="count" class="muted">/ 0</span>
      <button class="icon" id="next">›</button>
      <span class="spacer"></span>
      <span id="find-box" hidden>
        <input id="find" type="search" />
        <span id="find-count" class="muted"></span>
      </span>
      <button class="icon" id="find-open">
        <svg
          width="13"
          height="13"
          viewBox="0 0 16 16"
          fill="none"
          aria-hidden="true"
        >
          <circle
            cx="7"
            cy="7"
            r="4.5"
            stroke="currentColor"
            stroke-width="1.3"
          />
          <path
            d="M10.5 10.5L14 14"
            stroke="currentColor"
            stroke-width="1.3"
            stroke-linecap="round"
          />
        </svg>
      </button>
      <button class="icon" id="zoom-out">−</button>
      <span id="zoom" class="muted">100%</span>
      <button class="icon" id="zoom-in">+</button>
      <button id="fit"></button>
    </div>
    <main id="viewer"></main>
    <p id="status" class="empty"></p>
    <script type="module">
      // PDF.js's worker runs here rather than in a worker of its own: a
      // sandboxed frame can't start a module worker. pdf.js finds it on
      // globalThis.pdfjsWorker and parses on this thread.
      import * as worker from "textus-resource:lib/pdf.worker.min.mjs";
      import * as pdfjs from "textus-resource:lib/pdf.min.mjs";
      globalThis.pdfjsWorker = worker;
      window.pdfjsLib = pdfjs;
      window.dispatchEvent(new Event("pdfjs-ready"));
    </script>
    <script src="textus-resource:view.js"></script>
  </body>
</html>
