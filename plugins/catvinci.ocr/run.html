<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="textus-resource:run.css" />
  </head>
  <body>
    <div class="tx-bar">
      <span id="status" class="tx-value"></span>
      <span class="tx-spacer"></span>
      <button class="tx-button small" id="stop"></button>
    </div>
    <div id="progress" class="tx-progress" role="progressbar" style="--value: 0"></div>
    <canvas id="canvas" hidden></canvas>
    <script type="module">
      // pdf.js parses on this thread: a sandboxed frame starts no module
      // worker, so it finds its worker's code on globalThis.pdfjsWorker.
      import * as worker from "textus-resource:lib/pdf.worker.min.mjs";
      import * as pdfjs from "textus-resource:lib/pdf.min.mjs";
      globalThis.pdfjsWorker = worker;
      window.pdfjsLib = pdfjs;
      window.dispatchEvent(new Event("pdfjs-ready"));
    </script>
    <script src="textus-resource:run.js"></script>
  </body>
</html>
