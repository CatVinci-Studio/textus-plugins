<!doctype html>
<html lang="{{lang}}">
  <head>
    <link rel="stylesheet" href="textus-resource:view.css" />
  </head>
  <body>
    <div class="toolbar">
      <span id="name" class="muted"></span>
      <span class="spacer"></span>
      <span id="page" class="muted"></span>
      <button class="icon" id="zoom-out">−</button>
      <button id="zoom" class="muted">100%</button>
      <button class="icon" id="zoom-in">+</button>
      <button class="icon" id="find-open">⌕</button>
      <button id="edit" class="primary"></button>
    </div>
    <div id="find-bar" class="toolbar" hidden>
      <input id="find-input" type="search" />
      <span id="find-count" class="muted"></span>
      <span class="spacer"></span>
      <button class="icon" id="find-close">×</button>
    </div>
    <main id="pages"></main>
    <p id="status" class="empty"></p>
    <script src="textus-resource:lib/jszip.min.js"></script>
    <script src="textus-resource:lib/docx-preview.min.js"></script>
    <script src="textus-resource:view.js"></script>
  </body>
</html>
