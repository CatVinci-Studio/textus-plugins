<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="textus-resource:lib/chart.css" />
    <style>
      #chart > svg {
        height: auto;
      }
    </style>
  </head>
  <body>
    <div id="chart"></div>
    <div id="chart-problem" role="alert" hidden></div>
    <script src="textus-resource:lib/chart-page.js"></script>
    <script src="textus-resource:lib/viz-global.js"></script>
    <script src="textus-resource:lib/themes.js"></script>
    <!-- The engine is a module, so the drawing code lives in the page. -->
    <script type="module">
      import { renderToString } from "textus-resource:lib/plantuml.js";

      function render(source, dark) {
        return new Promise(function (resolve, reject) {
          renderToString(String(source).split("\n"), resolve, reject, {
            dark: dark,
          });
        });
      }

      // The server's fixed size, stretch and background give way to the page.
      function fromServer(el, svg) {
        el.innerHTML = svg;
        const root = el.querySelector("svg");
        if (!root) return;
        root.removeAttribute("style");
        root.removeAttribute("preserveAspectRatio");
      }

      drawChartBlock({
        draw: async function (el, source, meta, dark, server) {
          if (server) fromServer(el, dark ? server.dark : server.svg);
          else el.innerHTML = await render(source, dark);
        },
        picture: function (el, source, meta, dark, server) {
          if (server) return dark ? server.dark : server.svg;
          return render(source, dark);
        },
      });
    </script>
  </body>
</html>
