<!doctype html>
<html lang="{{lang}}">
  <head>
    <link rel="stylesheet" href="textus-resource:slides.css" />
    <style id="deck"></style>
  </head>
  <body>
    <div class="tx-bar" id="bar">
      <div class="tx-pager">
        <button class="tx-icon-button" id="prev" aria-label="←"><span class="tx-icon" data-icon="left"></span></button>
        <span class="tx-value" id="count"></span>
        <button class="tx-icon-button" id="next" aria-label="→"><span class="tx-icon" data-icon="right"></span></button>
      </div>
      <span class="tx-spacer"></span>
      <button class="tx-button small" id="export"></button>
      <button class="tx-button small primary" id="full"></button>
    </div>
    <main id="stage"></main>
    <script src="textus-resource:page.js"></script>
  </body>
</html>
