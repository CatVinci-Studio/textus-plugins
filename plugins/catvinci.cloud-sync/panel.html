<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="textus-resource:panel.css" />
  </head>
  <body>
    <main>
      <section class="sync-status" aria-label="Sync status">
        <div class="status-row">
          <div class="status-text">
            <p
              id="status"
              role="status"
              aria-live="polite"
              data-t="loading"
            ></p>
            <p id="summary" class="muted small" hidden></p>
            <p id="last-run" class="muted small" hidden></p>
          </div>
          <div class="actions">
            <button
              type="button"
              class="tx-button"
              id="cancel"
              data-t="cancel"
              hidden
            ></button>
            <button
              type="button"
              class="tx-button primary"
              id="sync"
              data-t="sync"
              disabled
            ></button>
          </div>
        </div>
        <button
          type="button"
          class="tx-button sidebar-only"
          id="openSettings"
          data-t="openSettings"
        ></button>
        <div id="progress" class="tx-progress" role="progressbar" hidden></div>
        <div id="results"></div>
      </section>
      <form id="connection" autocomplete="off">
        <fieldset id="fields" disabled>
          <h2 class="tx-group-title" data-t="connectionTitle"></h2>
          <div class="tx-group">
            <div class="tx-row">
              <div class="row-text">
                <label for="provider-pick" data-t="service"></label>
                <p id="nutstore-help" class="hint" data-t="nutstoreHelp" hidden></p>
              </div>
              <button type="button" class="tx-select" id="provider-pick">
                <span id="provider-name"></span
                ><span class="tx-icon" data-icon="chevron"></span>
              </button>
            </div>
            <input id="provider" type="hidden" value="s3" />
            <div class="tx-row" id="endpoint-field">
              <label for="endpoint" data-t="endpoint"></label
              ><input
                id="endpoint"
                type="url"
                placeholder="https://"
                spellcheck="false"
              />
            </div>
            <div class="tx-row" id="bucket-field">
              <label for="bucket" data-t="bucket"></label
              ><input id="bucket" spellcheck="false" />
            </div>
            <div class="tx-row">
              <label for="account" id="account-label"></label
              ><input id="account" autocomplete="off" spellcheck="false" />
            </div>
            <div class="tx-row">
              <label for="secret" id="secret-label"></label
              ><input id="secret" type="password" autocomplete="new-password" />
            </div>
            <div class="tx-row">
              <label for="prefix" data-t="prefix"></label
              ><input id="prefix" required spellcheck="false" />
            </div>
            <details id="s3-more" class="tx-disclosure">
              <summary data-t="moreOptions"></summary>
              <div class="tx-row">
                <label for="region" data-t="region"></label
                ><input id="region" spellcheck="false" />
              </div>
              <div class="tx-row">
                <label for="token" data-t="token"></label
                ><input id="token" type="password" autocomplete="new-password" />
              </div>
              <div class="tx-row">
                <label for="pathStyle" data-t="pathStyle"></label
                ><input id="pathStyle" type="checkbox" role="switch" class="tx-switch" />
              </div>
            </details>
          </div>
          <h2 class="tx-group-title" data-t="encryptionTitle"></h2>
          <div class="tx-group">
            <div class="tx-row">
              <div class="row-text">
                <label id="encrypt-label" for="encrypt" data-t="encrypt"></label>
                <p class="hint" id="encrypt-help" data-t="encryptHelp"></p>
              </div>
              <input
                id="encrypt"
                type="checkbox"
                role="switch"
                class="tx-switch"
                aria-labelledby="encrypt-label"
                aria-describedby="encrypt-help"
              />
            </div>
            <div class="tx-row" id="password-field">
              <div class="row-text">
                <label for="sync-password" data-t="syncPassword"></label>
                <p class="hint" id="encryption-help" data-t="encryptionHelp"></p>
              </div>
              <input
                id="sync-password"
                type="password"
                autocomplete="new-password"
                minlength="12"
                maxlength="1024"
                aria-describedby="encryption-help"
              />
            </div>
            <div class="tx-row" id="confirm-field">
              <label for="confirm-password" data-t="confirmPassword"></label>
              <input
                id="confirm-password"
                type="password"
                autocomplete="new-password"
                maxlength="1024"
              />
            </div>
          </div>
          <div class="tx-group">
            <div class="tx-row">
              <label id="automatic-label" for="automatic" data-t="automatic"></label>
              <input
                id="automatic"
                type="checkbox"
                role="switch"
                class="tx-switch"
                aria-labelledby="automatic-label"
              />
            </div>
            <div class="tx-row">
              <div class="row-text">
                <label for="keep-pick" data-t="keepHistory"></label>
                <p class="hint" id="keep-help" data-t="keepHistoryHelp"></p>
              </div>
              <button type="button" class="tx-select" id="keep-pick" aria-describedby="keep-help">
                <span id="keep-name"></span
                ><span class="tx-icon" data-icon="chevron"></span>
              </button>
            </div>
            <input id="keepDays" type="hidden" value="90" />
            <div class="tx-row" id="interval-field">
              <label for="interval" data-t="interval"></label
              ><input
                id="interval"
                class="number"
                type="number"
                min="5"
                max="1440"
                step="1"
                required
              />
            </div>
          </div>
          <div class="tx-group">
            <div class="tx-row stack">
              <div class="row-text">
                <label for="exclude" data-t="exclude"></label>
                <p id="exclude-hint" class="hint" data-t="excludeHint"></p>
              </div>
              <textarea
                id="exclude"
                rows="3"
                maxlength="20000"
                spellcheck="false"
                aria-describedby="exclude-hint"
              ></textarea>
            </div>
            <div class="tx-row">
              <label id="gitignore-label" for="gitignore" data-t="gitignore"></label>
              <input
                id="gitignore"
                type="checkbox"
                role="switch"
                class="tx-switch"
                aria-labelledby="gitignore-label"
              />
            </div>
            <div class="tx-row">
              <label id="obsidian-label" for="obsidian" data-t="obsidian"></label>
              <input
                id="obsidian"
                type="checkbox"
                role="switch"
                class="tx-switch"
                aria-labelledby="obsidian-label"
              />
            </div>
          </div>
          <div class="form-end">
            <p id="credentials-state" class="hint"></p>
            <button
              type="button"
              class="tx-button"
              id="test"
              data-t="test"
              disabled
            ></button
            ><button
              type="button"
              class="tx-button primary"
              id="save"
              data-t="save"
            ></button>
          </div>
        </fieldset>
      </form>
      <h2 class="tx-group-title recovery" data-t="advanced"></h2>
      <div class="tx-group">
        <div class="tx-row start">
          <button
            type="button"
            class="tx-button"
            id="unlock"
            data-t="unlock"
            disabled
          ></button>
        </div>
      </div>
    </main>
    <script src="textus-resource:panel.js"></script>
  </body>
</html>
