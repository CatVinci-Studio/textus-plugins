<!doctype html>
<html lang="{{lang}}">
  <head>
    <link rel="stylesheet" href="textus-resource:panel.css" />
  </head>
  <body>
    <div class="toolbar">
      <strong id="title"></strong>
      <span class="spacer"></span>
      <button id="new" class="primary"></button>
    </div>
    <input id="filter" type="search" hidden />
    <ul id="notes" class="list"></ul>
    <div id="undo-bar" class="undo-bar" hidden>
      <span id="undo-text"></span>
      <button id="undo"></button>
    </div>
    <p id="empty" class="empty" hidden></p>
    <script src="textus-resource:panel.js"></script>
  </body>
</html>
