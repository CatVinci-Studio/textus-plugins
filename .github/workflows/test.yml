name: test

# Every manifest read, the packages built, the tests run - on each pull
# request and push.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # check-bumps compares the plugins with main.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - if: github.event_name == 'pull_request'
        run: node scripts/check-bumps.mjs origin/${{ github.base_ref }}
      - run: npm run build
