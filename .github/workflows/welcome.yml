# One welcome on a person's first issue or pull request here.
name: welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Thanks for your first issue in Textus Plugins! We usually reply within a week.

            感谢你第一次参与 Textus 插件！我们一般一周内回复。
          pr-message: |
            Thanks for your first pull request to Textus Plugins! We reply within 3 days. While you wait, please make sure `npm run check` passes and the description says what you tested.

            感谢你给 Textus 插件的第一个 PR！我们 3 天内回复。请确认 `npm run check` 通过，并在描述里写明测了什么。
